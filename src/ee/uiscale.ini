; Soldiers: Heroes of World War II - Enhanced Edition (R1.28.8) + Enhancement Pack
; Settings of d3d9.dll (next to this file). 1 = on, 0 = off. Every change is made in memory only: Soldiers.exe is
; never changed, and each fix checks the program's bytes first: where they differ from R1.28.8 it does nothing.

[EE]
; UiFactor = how many times larger the interface is drawn: 3 = three times (the game lays its interface out at
; 1280x720 on a 3840x2160 screen and the pack draws it x3). 2 = the game's own behaviour (it draws the interface x2
; by itself on screens wider than 2560). 0 = this part off. The factor is lowered when the laid-out interface would
; be smaller than 800x600 (the smallest mode the game offers): 3440x1440 and 3840x1600 get 2.
UiFactor=3
; UiMinWidth = the bigger interface only for screen modes at least this wide (pixels); narrower modes keep the
; interface at its normal size. 2561 matches the game's own rule ("wider than 2560").
UiMinWidth=2561
; MouseFix = 1: at factor 2 or 3 the game only notices a slow mouse movement once it adds up to a whole interface
; pixel per input batch, so hover highlights and clicks lagged behind the pointer. The pack keeps the remainder per
; axis and passes the movement on exactly. 0 = the game's own movement handling.
MouseFix=1
; MouseLog = 1: diagnostic only. Writes a line to ee.log (needs Log=1) whenever the real pointer has stood still
; for a moment more than 6 pixels away from where the game last saw it move. 0 = off.
MouseLog=0
; UiUpscale = 1: interface pictures and the mouse pointers are redrawn smooth at the bigger size (xBRZ), with the
; remade pictures from the uiscale_hd folder where one exists. Needed for HDText. 0 = plain enlarged pixels.
UiUpscale=1
; HDText = 1: interface text is redrawn from real fonts, sharp (needs hdtext_fonts.bin next to this file and
; UiFactor=3). 0 = the text gets the smoothing of UiUpscale only.
HDText=1
; ListText = 1: the small text in lists, drop-down boxes and edit fields is sharp as well, with single letters where
; the game copies a box into the window behind it (drop-down values). 0 = that font stays smoothed.
ListText=1
; DragText: the dragged item and its name label (inventory, exchange window) drawn sharp. Not available on this
; program yet (the part it needs was not ported to Direct3D 9); keep 0.
DragText=0
; FpsList = 1: Options > Video > Max FPS offers V-Sync (the game's own "-" row), 240, 120, 60 and 30.
; 0 = the game's own list.
FpsList=1
; SoundVoices = how many sounds may play at once in battle. The game's own most is 20; 64 lets about three times as
; many effects play. Options > Audio > Buffers then also offers 64, the page no longer crashes on values that are
; not in its list, and profiles at 20 are raised to this value once. Any value from 21 to 256 switches this on;
; any other value (for example 0) = the game's own list.
SoundVoices=64
; ScrollFix = 1: a camera key let go while you control a unit directly (End, or Ctrl held) also stops the camera
; scroll (without it the camera could keep scrolling). 0 = the game's own behaviour.
ScrollFix=1
; KeysDefaults = 1: RESTORE DEFAULTS on the Options > KEYS page shows the modern WASD layout; APPLY saves it, BACK
; leaves the keys file as it was. 0 = the game's own default keys.
KeysDefaults=1
; NewProfileKeys = 1: a profile created on the login screen starts with the modern WASD layout. A keys file that
; already exists is never touched. 0 = new profiles get the game's own keys.
NewProfileKeys=1
; CameraZoom = 1: the mouse wheel zooms the camera further out. CameraMinHeight / CameraMaxHeight = closest and
; farthest camera height, CameraZoomStep = height change per wheel step. Values out of range switch the zoom off.
; Camera range after zocker_160's widescreen fix. 0 = the game's own range.
CameraZoom=1
CameraMinHeight=700
CameraMaxHeight=3000
CameraZoomStep=150
; SkipLogos = 1: the four company logo videos at start are not played (the files stay where they are).
SkipLogos=1
; VersionLine = 1: the version line in the menus shows VersionText in brackets. 0 = the game's own "(R1.28.8)".
; Saves, network and logs keep the game's own version text either way.
VersionLine=1
; VersionText = the text inside the brackets of that line (the characters < > % are left out, at most 63
; characters; empty = the default below).
VersionText=R1.28.8 + Enhancement Pack 1.2
; HideMultiplayer = 1: the main menu has no MULTI PLAYER entry (it only worked with Steam); the entries below it move
; up. 0 = the game's own menu.
HideMultiplayer=1
; HideMods = 1: the main menu has no MODS entry (the Workshop only worked with Steam). 0 = the game's own menu.
HideMods=1
; MakeProfile = 1: at the first start with no profile, the pack makes the profile "player" (WASD keys, the game's
; default options, 64 sounds) before the game reads it; without it the game stops with "File not found". A profile
; that is already there is never changed; a half one only gets its missing files. 0 = the game's own start.
MakeProfile=1
; Splash4K = 1: the start-up picture is drawn three times larger and sharp, centred on a 4K screen, with the
; "ENHANCED EDITION" line (needs uiscale_hd\splash4k_ee.bin). Without the file, or for another picture or language,
; the game's own small picture is shown. 0 = always the game's own.
Splash4K=1
; Log = 1: writes ee.log next to the game: which parts are on, and every program check (a part whose bytes do not
; match is named there). Also on with the environment variable EE_LOG=1. 0 = no log (the program's default when the
; key is missing).
Log=1
; D3DLog = 1: testing only. Records Direct3D calls (device set-up, first textures) in ee.log; creating a file named
; ee_capture.now next to the game records the next frame call by call (ee_frame_N.txt). Slow. 0 = off.
D3DLog=0

[uiscale]
; Fine points of the interface pictures; leave them as they are.
; Upscale = 1: smooth copies of interface pictures (0 = off; [EE] UiUpscale=0 switches the whole picture part off).
Upscale=1
; PaintedArt = 1: painted art on mostly transparent sheets (inventory figure, bag, weapon bar, map pages) uses a
; remade file from uiscale_hd when one exists.
PaintedArt=1
; ThickLines = 1: interface lines (the drag-select box) are drawn as thick as designed (3 screen pixels).
ThickLines=1
; TileEdges = 1: the corners of framed boxes join their edge pieces without single light or dark dots.
TileEdges=1
; SmoothShrink = 1: pictures the game draws smaller than their own size (the menu logo) get a clean copy at the
; exact drawn size (from the 4x file in uiscale_hd where one exists).
SmoothShrink=1
; PixelFix = 1: the interface sits exactly on the real pixels (no thin line of 3D world at the screen edges).
PixelFix=1
; HDCache = 1: use the remade pictures in the uiscale_hd folder. 0 = only the copies made at run time.
HDCache=1
; PhotoSmooth = 1: photographic pictures without a remade file get a soft (Lanczos) enlargement instead of the
; sharp one. 0 = off.
PhotoSmooth=0

; Keys the dll also reads but this file leaves out (default when missing):
;   [EE] UiPointer=1      the mouse pointer is enlarged by the interface factor (0 = 32 pixels).
;   [EE] StrictProgram=0  1 = every part stays off unless the program's header matches R1.28.8 exactly as well
;                         (by default only the build time stamp and one code check must match; each part still
;                         checks its own bytes).
;   [uiscale] HDText=1, ListText=1   old places of HDText / ListText, read only when the [EE] key is missing.
